<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web 全音域電子琴 (真實樂器音色庫版)</title>
  <!-- 引入開源真實樂器 Soundfont 播放器庫 -->
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <style>
    :root {
      --bg-color: #10121A;
      --panel-bg: #181B26;
      --accent-color: #00E5FF;
      --accent-pink: #FF0055;
      --text-color: #E2E8F0;
      --key-white: #FFFFFF;
      --key-black: #1E2022;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    .synth-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      padding: 14px 18px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px; 
      height: 8px;
      border-radius: 50%;
      background-color: #FFB300;
      transition: background-color 0.3s;
    }

    .status-dot.connected {
      background-color: #00FF66;
      box-shadow: 0 0 8px #00FF66;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 12px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 0.7rem;
      color: #8A99AD;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="range"] {
      width: 100%;
      background: #0F1017;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-color);
      padding: 5px 8px;
      border-radius: 6px;
      outline: none;
      font-size: 0.82rem;
    }

    select:focus { border-color: var(--accent-color); }

    .display-panel {
      text-align: center;
      background: #0D0E15;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid rgba(0, 229, 255, 0.2);
      display: flex;
      justify-content: space-around;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .display-panel span { color: var(--accent-color); font-weight: bold; }

    /* 琴鍵滾動區 */
    .keyboard-wrapper {
      flex: 1;
      width: 100%;
      min-height: 220px;
      max-height: 270px;
      overflow-x: auto;
      overflow-y: hidden;
      border-radius: 10px;
      background: #0A0B10;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-color) #181B26;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 8px 14px;
      margin: auto 0;
    }

    .keyboard-wrapper::-webkit-scrollbar { height: 8px; }
    .keyboard-wrapper::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border-radius: 4px;
    }

    .piano {
      display: inline-flex;
      position: relative;
      height: 210px;
      min-width: max-content;
      margin: 0 auto;
      padding: 0 10px;
    }

    .key {
      position: relative;
      cursor: pointer;
      border-radius: 0 0 6px 6px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8px;
      font-size: 0.72rem;
      font-weight: bold;
      touch-action: none;
      flex-shrink: 0;
    }

    .key .key-label { font-size: 0.65rem; opacity: 0.75; }
    .key .note-label { font-size: 0.6rem; margin-top: 2px; opacity: 0.55; }

    .key.white {
      width: 44px;
      height: 200px;
      background: var(--key-white);
      color: #222;
      border: 1px solid #BBB;
      border-top: none;
      z-index: 1;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
    }

    .key.white.active {
      background: var(--accent-color) !important;
      color: #000;
      transform: translateY(2px);
      box-shadow: 0 0 12px var(--accent-color);
    }

    .key.black {
      width: 26px;
      height: 125px;
      background: var(--key-black);
      color: #CCC;
      margin-left: -13px;
      margin-right: -13px;
      z-index: 2;
      border-radius: 0 0 4px 4px;
      box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.5);
    }

    .key.black.active {
      background: var(--accent-pink) !important;
      color: #FFF;
      transform: translateY(2px);
      box-shadow: 0 0 12px var(--accent-pink);
    }

    .start-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent-color), #0088FF);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .hints {
      font-size: 0.72rem;
      color: #7A899B;
      margin-top: 8px;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="synth-container">
    <button id="start-btn" class="start-btn">🎵 點擊啟動聲音與 MIDI 連線</button>

    <div class="header">
      <div class="title">🎹 Web 琴鍵音樂教室</div>
      <div class="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">點擊上方按鈕載入音色庫與啟用 MIDI</span>
      </div>
    </div>

    <!-- 控制區 -->
    <div class="controls-grid">
      <div class="control-group">
        <label for="midi-select">🎹 連接 MIDI 裝置</label>
        <select id="midi-select">
          <option value="">-- 尚未搜尋裝置 --</option>
        </select>
      </div>

      <!-- 真實音色庫選擇 -->
      <div class="control-group">
        <label for="instrument-select">🎵 演奏音色</label>
        <select id="instrument-select">
          <optgroup label="真實樂器採樣 (Soundfont)">
            <option value="acoustic_grand_piano" selected>古典平台鋼琴 (Grand Piano)</option>
            <option value="bright_acoustic_piano">明亮鋼琴 (Bright Piano)</option>
            <option value="electric_piano_1">經典電鋼琴 (Electric Piano)</option>
            <option value="glockenspiel">鐵琴 (Glockenspiel)</option>
            <option value="church_organ">教堂管風琴 (Church Organ)</option>
            <option value="acoustic_guitar_nylon">古典尼龍吉他 (Guitar)</option>
            <option value="vibraphone">顫音琴 (Vibraphone)</option>
          </optgroup>
          <optgroup label="類比合成器波形">
            <option value="synth_sawtooth">合成器 - 鋸齒波 (Sawtooth)</option>
            <option value="synth_sine">合成器 - 正弦波 (Sine)</option>
            <option value="synth_square">合成器 - 方波 (Square)</option>
            <option value="synth_triangle">合成器 - 三角波 (Triangle)</option>
          </optgroup>
        </select>
      </div>

      <div class="control-group">
        <label for="key-range">琴鍵顯示數量</label>
        <select id="key-range">
          <option value="25">25 鍵 (C4 - C6)</option>
          <option value="37" selected>37 鍵 (F3 - F6)</option>
          <option value="49">49 鍵 (C3 - C7)</option>
          <option value="61">61 鍵 (C2 - C7)</option>
          <option value="88">88 鍵 (A0 - C8 全音域)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="volume">主音量</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
      </div>

      <div class="control-group">
        <label for="octave">電腦鍵盤移調</label>
        <select id="octave">
          <option value="-12">-1 八度</option>
          <option value="0" selected>標準八度</option>
          <option value="12">+1 八度</option>
        </select>
      </div>
    </div>

    <!-- 狀態顯示 -->
    <div class="display-panel">
      <div>音符：<span id="display-note">--</span></div>
      <div>MIDI 碼：<span id="display-number">--</span></div>
      <div>訊號來源：<span id="display-source">--</span></div>
      <div>音色狀態：<span id="display-soundfont">準備就緒</span></div>
    </div>

    <!-- 鋼琴鍵盤區域 -->
    <div class="keyboard-wrapper">
      <div class="piano" id="piano"></div>
    </div>

    <div class="hints">
      💡 電腦鍵盤按鍵：<b>[下排] Z X C V B N M</b> (黑鍵 S D G H J) | <b>[上排] Q W E R T Y U</b> (黑鍵 2 3 5 6 7)
    </div>
  </div>

  <script>
    let audioCtx = null;
    let masterGain = null;
    let currentInstrument = null; // 當前加載的 Soundfont 樂器實例
    let activeSoundfontNotes = {}; // 追蹤正在發聲的真實樂器節點
    let activeOscillators = {};    // 追蹤合成器發聲節點
    let midiAccess = null;
    let selectedMidiId = 'ALL';

    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    const keyToMidi = {
      'z': 48, 's': 49, 'x': 50, 'd': 51, 'c': 52, 'v': 53,
      'g': 54, 'b': 55, 'h': 56, 'n': 57, 'j': 58, 'm': 59,
      'q': 60, '2': 61, 'w': 62, '3': 63, 'e': 64, 'r': 65,
      '5': 66, 't': 67, '6': 68, 'y': 69, '7': 70, 'u': 71, 'i': 72
    };

    const startBtn = document.getElementById('start-btn');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const displayNote = document.getElementById('display-note');
    const displayNumber = document.getElementById('display-number');
    const displaySource = document.getElementById('display-source');
    const displaySoundfont = document.getElementById('display-soundfont');
    const midiSelect = document.getElementById('midi-select');
    const instrumentSelect = document.getElementById('instrument-select');
    const keyRangeSelect = document.getElementById('key-range');
    const volumeSlider = document.getElementById('volume');
    const octaveSelect = document.getElementById('octave');
    const pianoContainer = document.getElementById('piano');

    function midiToFrequency(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      startBtn.style.display = 'none';

      // 載入初始音色
      loadSelectedInstrument();
    }

    startBtn.addEventListener('click', () => {
      initAudio();
      tryInitMIDI();
    });

    volumeSlider.addEventListener('input', (e) => {
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
      }
    });

    // 載入指定的 Soundfont 真實樂器
    async function loadSelectedInstrument() {
      const selected = instrumentSelect.value;
      if (selected.startsWith('synth_')) {
        currentInstrument = null;
        displaySoundfont.textContent = "合成器模式";
        return;
      }

      displaySoundfont.textContent = "載入音色中...";
      try {
        currentInstrument = await Soundfont.instrument(audioCtx, selected, {
          destination: masterGain,
          soundfont: 'MusyngKite' // 採用音質更細膩的 MusyngKite 音色包
        });
        displaySoundfont.textContent = "真實音色已加載";
      } catch (err) {
        console.warn("無法取得高品質音色庫，切換回備用庫:", err);
        try {
          currentInstrument = await Soundfont.instrument(audioCtx, selected, {
            destination: masterGain
          });
          displaySoundfont.textContent = "真實音色已加載 (標準)";
        } catch (e) {
          currentInstrument = null;
          displaySoundfont.textContent = "載入失敗 (使用合成器)";
        }
      }
    }

    instrumentSelect.addEventListener('change', () => {
      if (audioCtx) loadSelectedInstrument();
    });

    function noteOn(midiNote, source = '', velocity = 100) {
      if (!audioCtx) initAudio();

      const normalizedGain = (velocity / 127) * parseFloat(volumeSlider.value);

      // 1. 若為真實 Soundfont 樂器
      if (currentInstrument) {
        if (activeSoundfontNotes[midiNote]) {
          activeSoundfontNotes[midiNote].stop();
        }
        // 播放真實採樣音符
        const noteNode = currentInstrument.play(midiNote, audioCtx.currentTime, {
          gain: normalizedGain,
          decay: 2.5
        });
        activeSoundfontNotes[midiNote] = noteNode;
      } 
      // 2. 若為類比合成器波形
      else {
        const oscType = instrumentSelect.value.replace('synth_', '');
        const freq = midiToFrequency(midiNote);
        if (activeOscillators[midiNote]) noteOff(midiNote);

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = oscType;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(Math.max(normalizedGain, 0.001), audioCtx.currentTime + 0.02);

        osc.connect(gainNode);
        gainNode.connect(masterGain);
        osc.start();

        activeOscillators[midiNote] = { osc, gainNode };
      }

      // 更新介面狀態
      const noteName = noteNames[midiNote % 12] + (Math.floor(midiNote / 12) - 1);
      displayNote.textContent = noteName;
      displayNumber.textContent = midiNote;
      displaySource.textContent = source || 'MIDI/Touch';

      const keyEl = document.querySelector(`[data-midi="${midiNote}"]`);
      if (keyEl) {
        keyEl.classList.add('active');
        keyEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function noteOff(midiNote) {
      // 停止 Soundfont 音色
      if (activeSoundfontNotes[midiNote]) {
        try {
          activeSoundfontNotes[midiNote].stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
        delete activeSoundfontNotes[midiNote];
      }

      // 停止合成器音色
      if (activeOscillators[midiNote]) {
        const { osc, gainNode } = activeOscillators[midiNote];
        gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
        setTimeout(() => { 
          try { osc.stop(); osc.disconnect(); } catch(e) {}
        }, 90);
        delete activeOscillators[midiNote];
      }

      const keyEl = document.querySelector(`[data-midi="${midiNote}"]`);
      if (keyEl) keyEl.classList.remove('active');
    }

    // 電腦鍵盤監聽
    const pressedKeys = new Set();
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const key = e.key.toLowerCase();
      if (keyToMidi[key] !== undefined && !pressedKeys.has(key)) {
        pressedKeys.add(key);
        const midiWithOctave = keyToMidi[key] + parseInt(octaveSelect.value);
        noteOn(midiWithOctave, `鍵盤 [${key.toUpperCase()}]`);
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (keyToMidi[key] !== undefined) {
        pressedKeys.delete(key);
        const midiWithOctave = keyToMidi[key] + parseInt(octaveSelect.value);
        noteOff(midiWithOctave);
      }
    });

    // MIDI API 初始化
    async function tryInitMIDI() {
      if (!navigator.requestMIDIAccess) {
        statusText.textContent = "瀏覽器不支援 Web MIDI API";
        return;
      }

      try {
        midiAccess = await navigator.requestMIDIAccess({ sysex: false });
        updateMidiDeviceList();
        midiAccess.onstatechange = () => updateMidiDeviceList();
      } catch (err) {
        if (err.name === 'SecurityError') {
          statusText.textContent = "MIDI 權限遭限制 (需 allow='midi')";
        } else {
          statusText.textContent = "MIDI 連線失敗：" + err.message;
        }
        midiSelect.innerHTML = '<option value="">MIDI 存取受限</option>';
      }
    }

    function updateMidiDeviceList() {
      if (!midiAccess) return;

      midiSelect.innerHTML = '';
      const inputs = Array.from(midiAccess.inputs.values());

      if (inputs.length === 0) {
        const opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "未偵測到 MIDI 裝置";
        midiSelect.appendChild(opt);
        
        statusDot.classList.remove('connected');
        statusText.textContent = "請連線 USB MIDI 電子琴";
        bindMidiListeners();
        return;
      }

      const allOpt = document.createElement('option');
      allOpt.value = "ALL";
      allOpt.textContent = `所有已連接裝置 (${inputs.length} 台)`;
      midiSelect.appendChild(allOpt);

      inputs.forEach(input => {
        const opt = document.createElement('option');
        opt.value = input.id;
        opt.textContent = input.name || `MIDI 裝置 (${input.id})`;
        midiSelect.appendChild(opt);
      });

      if (inputs.some(i => i.id === selectedMidiId)) {
        midiSelect.value = selectedMidiId;
      } else {
        selectedMidiId = 'ALL';
        midiSelect.value = 'ALL';
      }

      bindMidiListeners();
    }

    function bindMidiListeners() {
      if (!midiAccess) return;

      const inputs = midiAccess.inputs.values();
      let activeCount = 0;

      for (let input of inputs) {
        if (selectedMidiId === 'ALL' || input.id === selectedMidiId) {
          input.onmidimessage = handleMIDIMessage;
          activeCount++;
        } else {
          input.onmidimessage = null;
        }
      }

      if (activeCount > 0) {
        statusDot.classList.add('connected');
        statusText.textContent = `MIDI 已就緒 (${activeCount} 台裝置)`;
      }
    }

    function handleMIDIMessage(e) {
      const [status, note, velocity] = e.data;
      const command = status >> 4;
      const deviceName = e.target ? e.target.name : 'USB MIDI';

      if (command === 9 && velocity > 0) {
        noteOn(note, deviceName, velocity);
      } else if (command === 8 || (command === 9 && velocity === 0)) {
        noteOff(note);
      }
    }

    midiSelect.addEventListener('change', (e) => {
      selectedMidiId = e.target.value;
      bindMidiListeners();
    });

    // 琴鍵渲染
    function renderKeyboard() {
      pianoContainer.innerHTML = '';
      const range = keyRangeSelect.value;
      let startMidi = 60, endMidi = 84;

      if (range === '25') { startMidi = 60; endMidi = 84; }
      else if (range === '37') { startMidi = 53; endMidi = 89; }
      else if (range === '49') { startMidi = 48; endMidi = 96; }
      else if (range === '61') { startMidi = 36; endMidi = 96; }
      else if (range === '88') { startMidi = 21; endMidi = 108; }

      const midiToKeyLabel = {};
      const currentOctShift = parseInt(octaveSelect.value);
      for (let k in keyToMidi) {
        midiToKeyLabel[keyToMidi[k] + currentOctShift] = k.toUpperCase();
      }

      for (let i = startMidi; i <= endMidi; i++) {
        const isBlack = [1, 3, 6, 8, 10].includes(i % 12);
        const key = document.createElement('div');
        key.className = `key ${isBlack ? 'black' : 'white'}`;
        key.dataset.midi = i;

        const keyLabel = midiToKeyLabel[i] ? `<div class="key-label">${midiToKeyLabel[i]}</div>` : '';
        const noteLabel = `<div class="note-label">${noteNames[i % 12]}</div>`;
        key.innerHTML = `${keyLabel}${noteLabel}`;

        key.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          noteOn(i, 'Click/Touch', 100);
        });
        key.addEventListener('pointerup', (e) => {
          e.preventDefault();
          noteOff(i);
        });
        key.addEventListener('pointerleave', (e) => {
          e.preventDefault();
          noteOff(i);
        });

        pianoContainer.appendChild(key);
      }
    }

    keyRangeSelect.addEventListener('change', renderKeyboard);
    octaveSelect.addEventListener('change', renderKeyboard);

    renderKeyboard();
  </script>
</body>
</html>
